name: Prepare release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - name: Require a new manual run on main
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
        run: |
          test "$RELEASE_REF" = refs/heads/main
          test "$RELEASE_ATTEMPT" = 1

      - name: Checkout the selected main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@c8e77b72cd6022852162c92aa10e7e72b7209c9b # v2
        with:
          runtime: node@24.14.1
          cache: false
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate the release preparation
        id: candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: pnpm exec tsx scripts/release-github.ts prepare-check

      - name: Create or update the version PR
        if: steps.candidate.outputs.has-changesets == 'true'
        id: version
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: pnpm release:version
          pr-base-branch: main

      - name: Record the exact release candidate
        if: steps.candidate.outputs.has-changesets == 'true'
        id: record
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ steps.version.outputs.pr-number }}
        run: pnpm exec tsx scripts/release-github.ts record-candidate --pr-number "$RELEASE_PR"

      - name: Save the candidate for PR verification and release
        if: steps.candidate.outputs.has-changesets == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-candidate-${{ steps.record.outputs.head-sha }}
          path: .release/candidate.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
