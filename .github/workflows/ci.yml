name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Test, typecheck, lint, and verify publish archives
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24.14.1
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check workspace
        run: pnpm check

      - name: Build and verify publish dry run
        run: pnpm publish:dry-run

      - name: Save verified packages and content manifests
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npm-dry-run-${{ github.sha }}
          path: |
            .release/**/tarballs/*.tgz
            .release/**/manifest.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
